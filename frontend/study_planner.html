<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Planner — AEVON</title>
    <meta
      name="description"
      content="Browse chapter-wise study materials, video lectures, and documents for your subjects."
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* Subject Cards — overrides for specifics not in style.css */
      .subject-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 3px solid var(--subject-accent, var(--primary));
        border-radius: var(--radius-sm);
        padding: 20px 18px;
        cursor: pointer;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        text-align: center;
        -webkit-tap-highlight-color: transparent;
      }
      .subject-card:hover, .subject-card:focus {
        transform: translateY(-3px);
        border-color: var(--subject-accent, var(--primary));
        box-shadow: var(--shadow-md);
        outline: none;
      }
      .subject-card:active { transform: translateY(-1px); }

      /* Chapter table — clean overrides */
      .chapter-table thead { background: #FAFBFC; }
      .chapter-table th {
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
      }
      .chapter-table tbody tr:hover { background: var(--primary-light); }

      @media (max-width: 600px) {
        .subject-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .chapter-table-wrap { display: none !important; }
        .chapter-cards { display: flex !important; }
      }
      @media (max-width: 400px) {
        .subject-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>AEVON</h2>
          <div class="user-role">Student</div>
        </div>
        <nav class="sidebar-nav" id="nav-links"></nav>
        <div class="sidebar-footer">
          <button
            class="btn btn-secondary"
            style="width: 100%"
            onclick="handleLogout()"
          >
            Logout
          </button>
        </div>
      </aside>

      <main class="main-content">
        <div id="subjects-view">
          <div class="page-header">
            <div>
              <h1>Study Planner</h1>
              <p class="subtitle">
                Tap a subject to browse chapters, documents &amp; video
                lectures.
              </p>
            </div>
          </div>

          <div
            id="subjects-loading"
            style="text-align: center; padding: 3rem; color: var(--text-muted)"
          >
            <div class="spinner"></div>
            <p style="margin-top: 0.75rem; font-size: 0.9rem">
              Loading your subjects…
            </p>
          </div>

          <div id="subject-grid-container" style="display: none">
            <div class="subject-grid" id="subject-grid"></div>
          </div>

          <div id="no-subjects" class="empty-state" style="display: none">
            <svg
              width="52"
              height="52"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </svg>
            <h3>No Study Materials Yet</h3>
            <p>
              Your teacher hasn't uploaded any materials yet. Check back soon!
            </p>
          </div>
        </div>

        <div id="chapter-view">
          <div class="page-header" style="margin-bottom: 0.75rem">
            <div style="width: 100%">
              <button class="back-btn" onclick="showSubjects()">
                ← Back to Subjects
              </button>
              <h1
                id="chapter-view-title"
                style="font-size: clamp(1.1rem, 4vw, 1.6rem)"
              >
                Subject
              </h1>
              <p
                class="subtitle"
                id="chapter-view-subtitle"
                style="font-size: 0.85rem"
              ></p>
            </div>
          </div>

          <div
            class="card"
            style="margin-top: 1rem; padding: 0; overflow: hidden"
          >
            <div
              id="chapters-loading"
              style="
                text-align: center;
                padding: 2.5rem;
                color: var(--text-muted);
                display: none;
              "
            >
              <div class="spinner"></div>
              <p style="margin-top: 0.75rem; font-size: 0.9rem">
                Loading chapters…
              </p>
            </div>

            <div class="chapter-table-wrap">
              <table class="chapter-table">
                <thead>
                  <tr>
                    <th style="width: 52px">Sr.</th>
                    <th>Chapter Name</th>
                    <th>Document</th>
                    <th>YT Teacher</th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody id="chapters-tbody"></tbody>
              </table>
            </div>

            <div class="chapter-cards" id="chapters-cards"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/app.js"></script>
    <script>
      const ICON_COLORS = [
        "icon-0",
        "icon-1",
        "icon-2",
        "icon-3",
        "icon-4",
        "icon-5",
        "icon-6",
        "icon-7",
      ]
      let studentClassId = ""

      async function init() {
        const user = await requireAuth(["student"])
        if (!user) return
        renderSidebar("study_planner.html")

        const studentId = user.student_id
        if (!studentId) {
          document.getElementById("subjects-loading").style.display = "none"
          document.getElementById("no-subjects").style.display = "block"
          return
        }
        try {
          const analytics = await AnalyticsAPI.studentAnalytics(studentId)
          studentClassId = analytics.student?.class_id || ""
          if (!studentClassId) {
            document.getElementById("subjects-loading").style.display = "none"
            document.getElementById("no-subjects").style.display = "block"
            return
          }
          await loadSubjects()
        } catch (e) {
          document.getElementById("subjects-loading").style.display = "none"
          showToast(e.message, "error")
        }
      }

      async function loadSubjects() {
        document.getElementById("subjects-loading").style.display = "block"
        try {
          const res = await MaterialsAPI.getSubjectsForClass(studentClassId)
          const subjects = res.subjects || []
          document.getElementById("subjects-loading").style.display = "none"
          if (subjects.length === 0) {
            document.getElementById("no-subjects").style.display = "block"
          } else {
            renderSubjectCards(subjects)
            document.getElementById("subject-grid-container").style.display =
              "block"
          }
        } catch (e) {
          document.getElementById("subjects-loading").style.display = "none"
          showToast(e.message, "error")
        }
      }

      function renderSubjectCards(subs) {
        document.getElementById("subject-grid").innerHTML = subs
          .map((s, i) => {
            const initial = (s.name || "?")[0].toUpperCase()
            return `
                <div class="subject-card ${ICON_COLORS[i % ICON_COLORS.length]}" tabindex="0"
                     onclick="openSubject('${s.id}','${esc(s.name)}','${esc(s.code || "")}')"> 
                    <span class="subject-arrow">&#8250;</span>
                    <div class="subject-icon" style="font-size:1.5rem;font-weight:800;letter-spacing:-1px;">${initial}</div>
                    <div class="subject-name">${esc(s.name)}</div>
                    ${s.code ? `<div class="subject-code">${esc(s.code)}</div>` : ""}
                    <div class="subject-cta">View Chapters</div>
                </div>
            `
          })
          .join("")
      }

      async function openSubject(subjectId, subjectName, subjectCode) {
        document.getElementById("subjects-view").style.display = "none"
        document.getElementById("chapter-view").style.display = "block"
        document.getElementById("chapter-view-title").textContent = subjectName
        document.getElementById("chapter-view-subtitle").textContent =
          subjectCode ? `Code: ${subjectCode}` : "Chapter-wise study materials"

        document.getElementById("chapters-tbody").innerHTML = ""
        document.getElementById("chapters-cards").innerHTML = ""
        document.getElementById("chapters-loading").style.display = "block"

        try {
          const res = await MaterialsAPI.getAll(studentClassId, subjectId)
          document.getElementById("chapters-loading").style.display = "none"
          renderChapters(res.materials || [])
        } catch (e) {
          document.getElementById("chapters-loading").style.display = "none"
          showToast(e.message, "error")
        }
      }

      function renderChapters(list) {
        const tbody = document.getElementById("chapters-tbody")
        const cards = document.getElementById("chapters-cards")

        if (list.length === 0) {
          const empty = `<div class="empty-state">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <h3>No Chapters Yet</h3>
                <p>Materials for this subject haven't been uploaded yet.</p>
            </div>`
          tbody.innerHTML = `<tr><td colspan="5">${empty}</td></tr>`
          cards.innerHTML = empty
          return
        }

        let tableRows = ""
        let cardItems = ""

        list.forEach((m) => {
          const docHtml = buildDocCell(m)
          const teacherHtml = buildTeacherCell(m)
          const descHtml = m.description
            ? `<span class="desc-text" title="${esc(m.description)}">${esc(m.description)}</span>`
            : `<span class="na-chip">—</span>`

          // Desktop table row
          tableRows += `<tr>
                <td><span class="sr-badge">${m.chapter_no}</span></td>
                <td><span class="chapter-name-text">${esc(m.chapter_name)}</span></td>
                <td>${docHtml}</td>
                <td>${teacherHtml}</td>
                <td>${descHtml}</td>
            </tr>`

          // Mobile card
          cardItems += `<div class="chapter-card">
                <div class="chapter-card-header">
                    <span class="sr-badge">${m.chapter_no}</span>
                    <span class="chapter-card-name">${esc(m.chapter_name)}</span>
                </div>
                <div class="chapter-card-body">
                    <div class="chapter-card-row">
                        <span class="label">Doc</span>
                        ${docHtml || '<span class="na-chip">—</span>'}
                    </div>
                    <div class="chapter-card-row">
                        <span class="label">Teacher</span>
                        ${teacherHtml || '<span class="na-chip">—</span>'}
                    </div>
                    ${
                      m.description
                        ? `<div class="chapter-card-row" style="align-items:flex-start;">
                        <span class="label">Note</span>
                        <span class="desc-text" style="font-size:0.82rem;">${esc(m.description)}</span>
                    </div>`
                        : ""
                    }
                </div>
            </div>`
        })

        tbody.innerHTML = tableRows
        cards.innerHTML = cardItems
      }

      function buildDocCell(m) {
        if (!m.file_url) return `<span class="na-chip">—</span>`
        const ext = (m.file_name || "").split(".").pop().toLowerCase()
        let cls = "doc-btn-file",
          label = "Open File",
          icon = iconFile()
        if (ext === "pdf") {
          cls = "doc-btn-pdf"
          label = "Open PDF"
          icon = iconPdf()
        } else if (["jpg", "jpeg", "png"].includes(ext)) {
          cls = "doc-btn-img"
          label = "View Image"
          icon = iconImg()
        } else if (ext === "zip") {
          cls = "doc-btn-zip"
          label = "Download ZIP"
          icon = iconZip()
        }
        return `<a href="${esc(m.file_url)}" target="_blank" rel="noopener" class="doc-btn ${cls}">${icon}${label}</a>`
      }

      function buildTeacherCell(m) {
        if (m.teacher_name && m.youtube_url) {
          return `<a href="${esc(m.youtube_url)}" target="_blank" rel="noopener" class="teacher-name-link" title="Watch lecture by ${esc(m.teacher_name)}">${ytIcon()}${esc(m.teacher_name)}</a>`
        } else if (m.teacher_name) {
          return `<span class="teacher-name-plain">${esc(m.teacher_name)}</span>`
        } else if (m.youtube_url) {
          return `<a href="${esc(m.youtube_url)}" target="_blank" rel="noopener" class="teacher-name-link">${ytIcon()}Watch Video</a>`
        }
        return `<span class="na-chip">—</span>`
      }

      function showSubjects() {
        document.getElementById("chapter-view").style.display = "none"
        document.getElementById("subjects-view").style.display = "block"
        window.scrollTo({ top: 0, behavior: "smooth" })
      }

      /* SVG helpers */
      function ytIcon() {
        return `<svg width="15" height="15" viewBox="0 0 24 24" fill="#ef4444" style="flex-shrink:0"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-2.75 12.66 12.66 0 0 0-4.31-.77 12.66 12.66 0 0 0-4.31.77 4.83 4.83 0 0 1-3.77 2.75A4.78 4.78 0 0 0 2 10.5v3a4.78 4.78 0 0 0 1.43 3.81 4.83 4.83 0 0 1 3.77 2.75 12.66 12.66 0 0 0 4.31.77 12.66 12.66 0 0 0 4.31-.77 4.83 4.83 0 0 1 3.77-2.75A4.78 4.78 0 0 0 22 13.5v-3a4.78 4.78 0 0 0-2.41-3.81z"/><polygon fill="white" points="10 15 15 12 10 9 10 15"/></svg>`
      }
      function iconPdf() {
        return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`
      }
      function iconImg() {
        return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`
      }
      function iconZip() {
        return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`
      }
      function iconFile() {
        return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>`
      }

      function esc(str) {
        if (!str) return ""
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
      }

      init()
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Dashboard — AEVON Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
      /* Admin Dashboard — overrides only what style.css can't handle generically */

      .page-header {
        border-bottom: none;
        padding-bottom: 0;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      /* Search bar */
      .search-container { position: relative; width: 280px; }
      .search-input {
        width: 100%;
        padding: 8px 12px 8px 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        font-family: inherit;
        background: var(--surface);
        color: var(--text);
        outline: none;
        transition: var(--transition);
      }
      .search-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(49, 87, 213, 0.10);
      }
      .search-input::placeholder { color: var(--text-muted); }
      .search-icon-wrap {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }
      .search-results {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-lg);
        z-index: 1000;
        max-height: 380px;
        overflow-y: auto;
        display: none;
        padding: 6px;
      }
      .search-item {
        padding: 10px 12px;
        border-radius: var(--radius-xs);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.12s;
        margin-bottom: 2px;
      }
      .search-item:hover { background: var(--primary-light); }
      .search-item .avatar {
        width: 34px;
        height: 34px;
        background: var(--bg);
        border-radius: var(--radius-xs);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: var(--primary);
        font-size: 0.875rem;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }
      .search-item .type {
        font-size: 0.625rem;
        text-transform: uppercase;
        background: var(--primary-light);
        color: var(--primary);
        padding: 2px 7px;
        border-radius: var(--radius-xs);
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      /* Filter group */
      .filter-group {
        display: flex;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        gap: 0;
      }
      .filter-select {
        border: none;
        border-right: 1px solid var(--border);
        background: transparent;
        padding: 8px 12px;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        outline: none;
        font-family: inherit;
        transition: background 0.12s;
      }
      .filter-select:last-child { border-right: none; }
      .filter-select:hover { background: var(--bg); }

      /* Stat cards — responsive grid */
      .stats-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
      }
      .admin-stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 20px;
        position: relative;
        overflow: hidden;
        transition: var(--transition);
      }
      .admin-stat-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
        border-color: var(--border-strong);
      }
      .admin-stat-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: var(--stat-accent, var(--primary));
        border-radius: var(--radius-md) var(--radius-md) 0 0;
      }
      .stat-icon {
        font-size: 1.25rem;
        width: 36px;
        height: 36px;
        background: var(--primary-light);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
      }
      .stat-value {
        font-size: 1.875rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.03em;
        line-height: 1;
        margin-bottom: 6px;
      }
      .stat-label {
        font-size: 0.6875rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }

      /* Charts — responsive grid, no fixed ratio columns */
      .charts-grid {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
      }
      .chart-card {
        padding: 20px;
        min-width: 0; /* prevent grid blowout */
        overflow: hidden;
      }
      .card-header {
        margin-bottom: 16px;
        padding: 0;
        border: none;
      }
      .card-title {
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0;
        text-transform: none;
      }

      /* Risk badges */
      .risk-badge {
        padding: 3px 10px;
        border-radius: var(--radius-xs);
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .risk-high   { background: var(--danger-light);  color: var(--danger); }
      .risk-medium { background: var(--warning-light); color: var(--warning); }
      .risk-low    { background: var(--success-light); color: var(--success); }

      /* Loading state */
      .loading-premium {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 360px;
        text-align: center;
        gap: 12px;
        color: var(--text-muted);
      }
      .loading-premium .spinner { width: 28px; height: 28px; border-width: 3px; }

      /* Rank badges */
      .rank-indicator {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.75rem;
        flex-shrink: 0;
      }
      .rank-1 { background: #FFFBEB; color: var(--accent); border: 1px solid #FDE68A; }
      .rank-2 { background: #F8FAFC; color: var(--text-secondary); border: 1px solid #E2E8F0; }
      .rank-3 { background: #FFFCF0; color: #B45309; border: 1px solid #FDE68A; }

      @media (max-width: 1100px) {
        .stats-grid { grid-template-columns: repeat(2, 1fr); }
        .charts-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 768px) {
        .stats-grid { grid-template-columns: repeat(2, 1fr); }
        .header-actions { flex-wrap: wrap; gap: 8px; width: 100%; }
        .filter-group { flex: 1; }
        .search-container { width: 100% !important; flex: 1; }
      }
      @media (max-width: 480px) {
        .stats-grid { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
        </div>
        <nav class="sidebar-nav" id="nav-links"></nav>
        <div class="sidebar-footer">
          <button
            class="btn btn-secondary"
            style="width: 100%;"
            onclick="handleLogout()"
          >
            Sign Out
          </button>
        </div>
      </aside>

      <main class="main-content">
        <div class="page-header">
          <div>
            <h1>Global Analytics</h1>
            <p class="subtitle">
              Real-time system intelligence & student growth metrics
            </p>
          </div>
          <div class="header-actions" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;">
            <div class="filter-group">
              <select
                id="class-filter"
                class="filter-select"
                onchange="loadDashboard()"
              >
                <option value="all">All Classes</option>
              </select>
              <select
                id="exam-filter"
                class="filter-select"
                onchange="loadDashboard()"
              >
                <option value="all">All Exams</option>
              </select>
            </div>
            <div class="search-container">
              <svg class="search-icon-wrap" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input
                type="text"
                id="global-search"
                class="search-input"
                placeholder="Quick search..."
                oninput="handleSearch()"
              />
              <div id="search-results" class="search-results"></div>
            </div>
          </div>
        </div>

        <div id="loading" class="loading-premium">
          <div class="spinner"></div>
          <p style="font-weight: 600; color: var(--text-secondary); font-size: 0.9375rem; margin: 0;">
            Loading analytics...
          </p>
          <p style="color: var(--text-muted); font-size: 0.8125rem; margin: 0;">
            Aggregating exam data across all classes
          </p>
        </div>

        <div id="dashboard-content" class="hidden">
          <div class="stats-grid" id="stats-grid">
          </div>

          <div class="charts-grid">
            <div class="chart-card">
              <div class="card-header">
                <span class="card-title">Subject Mastery Index</span>
              </div>
              <div style="height: 350px">
                <canvas id="chart-subject-perf"></canvas>
              </div>
            </div>
            <div class="chart-card" id="card-class-comparison">
              <div class="card-header">
                <span class="card-title">Competitive Class Matrix</span>
              </div>
              <div style="height: 350px">
                <canvas id="chart-class-comparison"></canvas>
              </div>
            </div>
            <div class="chart-card hidden" id="card-student-perf">
              <div class="card-header">
                <span class="card-title">Student Growth Curve</span>
              </div>
              <div style="height: 350px">
                <canvas id="chart-student-perf"></canvas>
              </div>
            </div>
          </div>

          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 16px;">
            <div class="chart-card" style="min-width:0;">
              <div class="card-header">
                <span class="card-title">At-Risk Intervention</span>
                <span class="badge badge-danger">High Priority</span>
              </div>
              <div id="at-risk-container"></div>
            </div>

            <div class="chart-card" style="min-width:0;">
              <div class="card-header">
                <span class="card-title">Honor Roll</span>
                <span class="badge badge-success">Top Performers</span>
              </div>
              <div id="top-students-table"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/app.js"></script>
    <script>
      let allStudents = []
      let currentClassId = "all"

      async function init() {
        const user = await requireAuth(["admin"])
        if (!user) return
        renderSidebar("admin_dashboard.html")

        try {
          const { classes } = await AnalyticsAPI.getClasses()
          const cFilter = document.getElementById("class-filter")
          classes.forEach((c) => {
            const opt = document.createElement("option")
            opt.value = c.id
            opt.textContent = c.name
            cFilter.appendChild(opt)
          })
        } catch (e) {}

        try {
          await loadExamsForFilter("all")
        } catch (e) {}
        await loadDashboard()

        // Lazy load search data
        StudentsAPI.getAll()
          .then((res) => (allStudents = res.students))
          .catch(() => {})
      }

      async function loadDashboard() {
        const classId = document.getElementById("class-filter").value
        const examId = document.getElementById("exam-filter").value

        if (classId !== currentClassId) {
          currentClassId = classId
          try {
            await loadExamsForFilter(classId)
          } catch (e) {}
        }

        document.getElementById("loading").classList.remove("hidden")
        document.getElementById("dashboard-content").classList.add("hidden")

        try {
          const data = await AnalyticsAPI.overview(
            classId === "all" ? undefined : classId,
            examId === "all" ? undefined : examId,
          )
          renderStats(data)
          renderCharts(data)
          renderAtRisk(data.at_risk_students || [])
          renderTopStudents(data.top_students || [])
          document
            .getElementById("dashboard-content")
            .classList.remove("hidden")
        } catch (err) {
          showToast("Failed to load dashboard: " + err.message, "error")
          // Show empty dashboard instead of leaving spinner up
          document.getElementById("stats-grid").innerHTML =
            '<p style="color:var(--text-muted);padding:1rem;">Could not load analytics. Please refresh.</p>'
          document
            .getElementById("dashboard-content")
            .classList.remove("hidden")
        } finally {
          document.getElementById("loading").classList.add("hidden")
        }
      }

      async function loadExamsForFilter(classId) {
        try {
          const { exams } = await AdminAPI.getExams(
            classId === "all" ? null : classId,
          )
          const select = document.getElementById("exam-filter")
          const currentVal = select.value
          select.innerHTML =
            '<option value="all">All Exams</option>' +
            exams
              .map((e) => `<option value="${e.id}">${e.name}</option>`)
              .join("")
          if (Array.from(select.options).some((o) => o.value === currentVal))
            select.value = currentVal
        } catch (e) {
          console.warn("Could not load exams for filter:", e.message)
        }
      }

      function renderStats(data) {
        const classId = document.getElementById("class-filter").value
        const avgLabel = classId === "all" ? "System Avg" : "Class Avg"

        const stats = [
          { label: "Enrolled Students", value: data.total_students },
          { label: "Active Classes", value: data.total_classes },
          { label: avgLabel, value: `${data.average_percentage || 0}%` },
          {
            label: "Critical Risk",
            value: (data.at_risk_students || []).length,
          },
        ]

        document.getElementById("stats-grid").innerHTML = stats
          .map(
            (s) => `
                <div class="admin-stat-card">
                    <div class="stat-value">${s.value}</div>
                    <div class="stat-label">${s.label}</div>
                </div>
            `,
          )
          .join("")
      }

      function renderCharts(data) {
        const examId = document.getElementById("exam-filter").value
        const classId = document.getElementById("class-filter").value

        if (data.subject_performance) {
          Charts.renderSubjectPerformance(
            "chart-subject-perf",
            data.subject_performance,
          )
        }

        if (
          (examId !== "all" || classId !== "all") &&
          data.student_performance
        ) {
          document
            .getElementById("card-class-comparison")
            .classList.add("hidden")
          document
            .getElementById("card-student-perf")
            .classList.remove("hidden")
          Charts.renderStudentPerformance(
            "chart-student-perf",
            data.student_performance,
          )
        } else {
          document
            .getElementById("card-class-comparison")
            .classList.remove("hidden")
          document.getElementById("card-student-perf").classList.add("hidden")
          if (data.class_performance)
            Charts.renderClassComparison(
              "chart-class-comparison",
              data.class_performance,
            )
        }
      }

      function renderAtRisk(students) {
        const container = document.getElementById("at-risk-container")
        if (!students.length) {
          container.innerHTML =
            '<div class="p-3 text-center" style="color:var(--success); font-weight:800; background:rgba(16,185,129,0.05); border-radius:var(--radius-md);">All students meeting benchmarks.</div>'
          return
        }
        container.innerHTML = `<table class="data-table">
                <thead><tr><th>Student</th><th>Class</th><th>Risk Level</th></tr></thead>
                <tbody>${students
                  .map(
                    (s) => `
                    <tr onclick="window.location.href='student.html?id=${s.id}'" style="cursor:pointer">
                        <td style="font-weight:700; color:var(--navy);">${s.name}</td>
                        <td><span class="badge" style="background:#f1f5f9; color:#475569;">${s.class_name}</span></td>
                        <td><span class="risk-badge ${s.risk_level === "high" ? "risk-high" : "risk-medium"}">${s.risk_level}</span></td>
                    </tr>
                `,
                  )
                  .join("")}</tbody></table>`
      }

      function renderTopStudents(students) {
        const container = document.getElementById("top-students-table")
        if (!students.length) {
          container.innerHTML =
            '<div class="p-3 text-center text-muted">No assessment data available.</div>'
          return
        }
        container.innerHTML = `<table class="data-table">
                <thead><tr><th>Rank</th><th>Name</th><th>Efficiency</th></tr></thead>
                <tbody>${students
                  .map(
                    (s, i) => `
                    <tr>
                        <td><div class="rank-indicator ${i < 3 ? "rank-" + (i + 1) : ""}">${i + 1}</div></td>
                        <td style="font-weight:700; color:var(--navy);">${s.name}</td>
                        <td style="color:var(--success); font-weight:800; font-size:1.1rem;">${s.avg_percentage}%</td>
                    </tr>
                `,
                  )
                  .join("")}</tbody></table>`
      }

      function handleSearch() {
        const q = document
          .getElementById("global-search")
          .value.toLowerCase()
          .trim()
        const results = document.getElementById("search-results")
        if (q.length < 2) {
          results.style.display = "none"
          return
        }

        const filtered = allStudents
          .filter(
            (s) =>
              s.name.toLowerCase().includes(q) ||
              s.enrollment_no.toLowerCase().includes(q),
          )
          .slice(0, 8)
        if (!filtered.length) {
          results.innerHTML =
            '<div class="p-3 text-center text-muted">No student found matching query</div>'
        } else {
          results.innerHTML = filtered
            .map(
              (s) => `
                    <div class="search-item" onclick="window.location.href='student.html?id=${s.id}'">
                        <div class="avatar">${s.name.substring(0, 1).toUpperCase()}</div>
                        <div style="flex:1;">
                            <div style="font-weight:800; color:var(--navy);">${s.name}</div>
                            <div style="font-size:0.85rem; color:var(--text-muted);">${s.enrollment_no} • ${s.class_name}</div>
                        </div>
                        <span class="type">Student</span>
                    </div>
                `,
            )
            .join("")
        }
        results.style.display = "block"
      }

      document.addEventListener("click", (e) => {
        if (!document.getElementById("global-search").contains(e.target)) {
          document.getElementById("search-results").style.display = "none"
        }
      })

      init()
    </script>
  </body>
</html>
